name: Research Smoke Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt

      - name: Run proposal-core smoke test
        run: python -m research_harness.run --track proposal --start 2024-01-01 --end 2025-12-31

      - name: Build frontend
        run: npm run build
